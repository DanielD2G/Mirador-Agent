- eyJFAKE1.eyJzeW50aGV0aWM1.FAKEsignature1
- eyJFAKE2.eyJzeW50aGV0aWM2.FAKEsignature2
- eyJFAKE3.eyJzeW50aGV0aWM3.FAKEsignature3
- AKIAEXAMPLE000000000
- AKIAEXAMPLE000000001
- AKIAEXAMPLE000000002
- AKIAEXAMPLE000000003
- FAKE_query_key_0
