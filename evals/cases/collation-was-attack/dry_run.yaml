      - $tool:logs.datadog.count
      confidence: high
    - claim: Collation errors and forwarded keys reach auth-api
      tool_call_ids: &id002
      - $tool:logs.datadog.search
      confidence: high
    - claim: ALB returns 200 for both denied and successful probes
      tool_call_ids: &id003
      - $tool:logs.aws.search
      confidence: high
    - claim: Unicode path traversal from external IP
      tool_call_ids: &id004
      - $tool:network.aws.waf_sampled_requests
      confidence: high
    - claim: 10.0.3.4 belongs to NAT nat-0abc
      tool_call_ids: &id005
      - $tool:network.aws.nat_gateways
      confidence: high
    - claim: Three joined probes exceed 5000 bytes
      tool_call_ids: &id006
