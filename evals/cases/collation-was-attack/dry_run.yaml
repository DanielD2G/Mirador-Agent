    status: confirmed
    summary: atacante externo probando path traversal con Unicode; el 500 de collation
      es efecto secundario; 3 requests tuvieron éxito (respuesta ~5 KB); 10.0.3.4
      es la NAT propia reenviando las keys probadas a auth-api
    findings:
    - claim: 24 collation errors in files-api
