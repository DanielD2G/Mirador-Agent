      start: '2026-11-08T14:00:00+00:00'
      end: '2026-11-08T16:00:00+00:00'
      filter: campaign:unicode
      limit: 100
  - tool: logs.aws.search
    args:
      start: '2026-11-08T14:00:00+00:00'
      end: '2026-11-08T16:00:00+00:00'
      filter: campaign:unicode
      limit: 100
  - tool: network.aws.waf_sampled_requests
    args:
      start: '2026-11-08T14:00:00+00:00'
      end: '2026-11-08T16:00:00+00:00'
      web_acl: files-acl
      limit: 100
  - tool: network.aws.nat_gateways
    args: {}
  - tool: workspace.tables
    args: {}
  - tool: workspace.sql
    args:
      sql: SELECT a.request_id, a.bytes, a.client_ip, w.path FROM logs_aws_2 a JOIN
        network_aws_3 w USING (request_id) WHERE a.bytes > 5000 ORDER BY a.request_id
