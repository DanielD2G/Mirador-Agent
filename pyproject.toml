[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mirador"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai-agents==0.24.0",
    "graphiti-core[falkordb]==0.31.2",
    "duckdb==2.0.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "uvloop>=0.23.0",
    "typer>=0.28.0",
    "rich>=15.0.0",
    "aiosqlite>=0.22.1",
    "aioboto3>=15.5.0",
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "httpx2>=2.0.0",
]

[project.scripts]
mirador = "mirador.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.4",
    "import-linter>=2.16",
    "types-PyYAML>=6.0.12.20261103",
    "types-aioboto3[s3,logs,cloudwatch,cloudtrail,elbv2,ec2,wafv2,ecs,sts]>=15.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mirador"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]
